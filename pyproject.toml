[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-cli-assistant"
version = "0.1.0"
description = "A command-line AI assistant built with Python"
requires-python = ">=3.10"

dependencies = [
    "openai",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
ai-assistant = "ai_assistant.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]